<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>月相變化與公轉互動模擬器</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #030712;
      color: #f3f4f6;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
    }
    
    canvas {
      touch-action: none;
    }

    .glass-panel {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glow-yellow {
      box-shadow: 0 0 15px rgba(250, 204, 21, 0.35);
    }

    .glow-blue {
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.35);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.5);
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between select-none">

  <!-- Header Control Bar -->
  <header class="glass-panel sticky top-0 z-20 px-4 py-3 border-b border-gray-800 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-full bg-amber-400/20 border border-amber-400 flex items-center justify-center text-amber-300 font-bold text-lg">
        🌙
      </div>
      <div>
        <h1 class="text-lg md:text-xl font-bold bg-gradient-to-r from-amber-200 via-sky-200 to-indigo-200 bg-clip-text text-transparent">
          月相變化與公轉互動模擬器
        </h1>
        <p class="text-xs text-gray-400 hidden sm:block">拖曳月亮或使用自動播放，觀察地球視角的月相盈虧變化</p>
      </div>
    </div>

    <!-- Main Play Controls -->
    <div class="flex items-center flex-wrap gap-2">
      <button id="btnPlayPause" class="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm flex items-center gap-1.5 transition active:scale-95 glow-yellow">
        <span id="playIcon">▶</span> <span id="playText">自動播放</span>
      </button>

      <div class="flex items-center bg-gray-800/80 rounded-xl p-1 border border-gray-700/60">
        <span class="text-xs text-gray-400 px-2">速度</span>
        <input id="speedSlider" type="range" min="0.2" max="3" step="0.1" value="1" class="w-16 md:w-24 h-1.5 bg-gray-600 rounded-lg appearance-none cursor-pointer accent-amber-400">
        <span id="speedVal" class="text-xs text-amber-300 font-mono w-8 text-center">1.0x</span>
      </div>

      <button id="btnReset" class="px-3 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-200 text-sm font-medium border border-gray-700 transition active:scale-95">
        重置 (初一)
      </button>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-2 sm:p-4 grid grid-cols-1 lg:grid-cols-4 gap-4 items-start">
    
    <!-- Canvas Simulation Stage -->
    <section class="lg:col-span-3 glass-panel rounded-2xl p-2 sm:p-4 flex flex-col items-center justify-center relative overflow-hidden min-h-[480px] md:min-h-[580px]">
      
      <!-- Main Interactive Canvas -->
      <div class="relative w-full flex-1 flex items-center justify-center">
        <canvas id="simCanvas" class="w-full h-full rounded-xl"></canvas>
      </div>

      <!-- Touch Hint Overlay -->
      <div class="mt-2 text-2xs sm:text-xs text-gray-400 flex items-center gap-4">
        <span class="flex items-center gap-1"><span class="inline-block w-2 h-2 rounded-full bg-amber-400"></span> 沿圓形軌道拖曳月亮</span>
        <span class="flex items-center gap-1"><span class="inline-block w-2 h-2 rounded-full bg-rose-500"></span> 逆時針方向公轉</span>
      </div>
    </section>

    <!-- Side Panel -->
    <aside class="lg:col-span-1 space-y-4">
      
      <!-- Magnified Telescope Earth Perspective View Card -->
      <div class="glass-panel rounded-2xl p-4 flex flex-col items-center text-center glow-blue">
        <div class="flex items-center justify-between w-full mb-2">
          <span class="text-xs font-semibold text-sky-400 tracking-wider uppercase">地球視角仰望月相</span>
          <span id="badgePhaseType" class="px-2 py-0.5 rounded-full text-2xs font-bold bg-sky-500/20 text-sky-300 border border-sky-500/30">
            初一 · 朔
          </span>
        </div>

        <!-- Telescope Canvas View -->
        <div class="relative my-2 p-3 bg-slate-950 rounded-full border border-sky-500/30 shadow-inner flex items-center justify-center">
          <canvas id="telescopeCanvas" width="160" height="160" class="rounded-full"></canvas>
        </div>

        <div id="telescopePhaseTitle" class="text-lg font-bold text-amber-300 mt-1">
          農曆初一 · 朔 ( New Moon )
        </div>
        <p id="telescopeDesc" class="text-xs text-gray-300 mt-2 leading-relaxed min-h-[60px] text-left bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
          月球位於地球與太陽之間，受光面背對地球，從地球上無法看見月亮。
        </p>
      </div>

      <!-- Data Readout Panel -->
      <div class="glass-panel rounded-2xl p-4 space-y-3">
        <h3 class="text-xs font-semibold text-gray-400 tracking-wider uppercase border-b border-gray-800 pb-2">
          即時公轉數據
        </h3>

        <div class="grid grid-cols-2 gap-2 text-xs">
          <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
            <div class="text-gray-400 text-2xs">農曆日期</div>
            <div id="infoLunarDay" class="text-sm font-bold text-amber-300 mt-0.5">初一 (第 1 天)</div>
          </div>
          <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
            <div class="text-gray-400 text-2xs">主要月相</div>
            <div id="infoPhaseName" class="text-sm font-bold text-sky-300 mt-0.5">朔 (新月)</div>
          </div>
          <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
            <div class="text-gray-400 text-2xs">公轉角度</div>
            <div id="infoAngle" class="text-sm font-bold text-emerald-300 mt-0.5">0.0°</div>
          </div>
          <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
            <div class="text-gray-400 text-2xs">照亮比例 (地球視角)</div>
            <div id="infoIllumination" class="text-sm font-bold text-amber-200 mt-0.5">0.0%</div>
          </div>
        </div>

        <!-- Display Toggle Switches -->
        <div class="pt-2 border-t border-gray-800/80 space-y-2 text-xs">
          <label class="flex items-center justify-between cursor-pointer hover:text-white text-gray-300">
            <span>顯示空間視角月相 (軌道內側)</span>
            <input type="checkbox" id="chkSpaceMoons" checked class="w-4 h-4 rounded accent-amber-400 cursor-pointer">
          </label>
          <label class="flex items-center justify-between cursor-pointer hover:text-white text-gray-300">
            <span>顯示地球至月球視線</span>
            <input type="checkbox" id="chkSightLine" checked class="w-4 h-4 rounded accent-amber-400 cursor-pointer">
          </label>
        </div>
      </div>
    </aside>
  </main>

  <!-- Footer -->
  <footer class="text-center py-2 text-2xs text-gray-500 border-t border-gray-900">
    月相與公轉科學模擬教學工具 · 支援 iPad 與行動設備互動
  </footer>

  <!-- Javascript Logic -->
  <script>
    // --- LUNAR DAYS & PHASE DATA DEFINITIONS ---
    const LUNAR_DAY_NAMES = [
      "初一", "初二", "初三", "初四", "初五", "初六", "初七", "初八", "初九", "初十",
      "十一", "十二", "十三", "十四", "十五", "十六", "十七", "十八", "十九", "二十",
      "廿一", "廿二", "廿三", "廿四", "廿五", "廿六", "廿七", "廿八", "廿九", "三十"
    ];

    const EIGHT_PHASES = [
      { name: "朔", altName: "新月", minDay: 1, maxDay: 1, markerAngle: 0, dayRange: "初一", desc: "此時月球位於地球與太陽之間，面向地球的一面不受光，故不可見，稱之為『朔』。" },
      { name: "眉月", altName: "蛾眉月", minDay: 2, maxDay: 6, markerAngle: 45, dayRange: "初二 ~ 初六", desc: "月球公轉至太陽東側，地球視角可見右側一條極細的彎鉤狀亮面，於黃昏西天可見。" },
      { name: "上弦月", altName: "上弦月", minDay: 7, maxDay: 8, markerAngle: 90, dayRange: "初七 ~ 初八", desc: "月球公轉約 90 度，從地球看去右半邊被照亮，半圓形亮面朝右，上半夜出現在南方天空。" },
      { name: "盈凸月", altName: "漸盈凸月", minDay: 9, maxDay: 14, markerAngle: 135, dayRange: "初九 ~ 十四", desc: "亮面大於半圓並持續擴大，右側大部分表面被陽光照亮，月亮越來越圓。" },
      { name: "滿月", altName: "望", minDay: 15, maxDay: 16, markerAngle: 180, dayRange: "十五 ~ 十六", desc: "地球部位於太陽與月球之間，面向地球的一面完全被陽光照亮，整夜高掛天空。" },
      { name: "虧凸月", altName: "漸虧凸月", minDay: 17, maxDay: 21, markerAngle: 225, dayRange: "十七 ~ 廿一", desc: "滿月過後亮面開始虧缺，右側邊緣逐漸轉暗，左側大部分依然明亮。" },
      { name: "下弦月", altName: "下弦月", minDay: 22, maxDay: 22, markerAngle: 258, dayRange: "廿二", desc: "月球公轉約 270 度，從地球看去左半邊被照亮，半圓形亮面朝左，下半夜升起於東方天空。" },
      { name: "殘月", altName: "虧眉月", minDay: 23, maxDay: 30, markerAngle: 315, dayRange: "廿三 ~ 三十", desc: "月亮亮面縮小為左側的細鉤狀，於黎明前出現在東方天空。" }
    ];

    // State Variables
    let currentAngle = 0;
    let isPlaying = false;
    let playSpeed = 1.0;
    let isDragging = false;
    let dpr = window.devicePixelRatio || 1;

    // DOM Elements
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const teleCanvas = document.getElementById('telescopeCanvas');
    const teleCtx = teleCanvas.getContext('2d');

    const btnPlayPause = document.getElementById('btnPlayPause');
    const playIcon = document.getElementById('playIcon');
    const playText = document.getElementById('playText');
    const speedSlider = document.getElementById('speedSlider');
    const speedVal = document.getElementById('speedVal');
    const btnReset = document.getElementById('btnReset');
    const chkSpaceMoons = document.getElementById('chkSpaceMoons');
    const chkSightLine = document.getElementById('chkSightLine');

    // Info Readouts
    const infoLunarDay = document.getElementById('infoLunarDay');
    const infoPhaseName = document.getElementById('infoPhaseName');
    const infoAngle = document.getElementById('infoAngle');
    const infoIllumination = document.getElementById('infoIllumination');
    const badgePhaseType = document.getElementById('badgePhaseType');
    const telescopePhaseTitle = document.getElementById('telescopePhaseTitle');
    const telescopeDesc = document.getElementById('telescopeDesc');

    // Dimensions & Geometry Constants (CSS Pixel Units)
    let viewWidth = 800;
    let viewHeight = 600;
    let center = { x: 380, y: 300 };
    let orbitRadius = 160;

    function updateCanvasSize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      
      viewWidth = rect.width;
      viewHeight = Math.max(480, Math.min(rect.width * 0.72, 620));

      canvas.width = viewWidth * dpr;
      canvas.height = viewHeight * dpr;
      canvas.style.width = viewWidth + 'px';
      canvas.style.height = viewHeight + 'px';

      center = {
        x: viewWidth * 0.44,
        y: viewHeight * 0.52
      };

      orbitRadius = Math.min(viewWidth, viewHeight) * 0.28;
    }

    function normalizeAngle(deg) {
      deg = deg % 360;
      if (deg < 0) deg += 360;
      return deg;
    }

    function angleToPosition(deg, radius) {
      const rad = (deg * Math.PI) / 180;
      return {
        x: center.x + radius * Math.cos(rad),
        y: center.y - radius * Math.sin(rad)
      };
    }

    function positionToAngle(px, py) {
      const dx = px - center.x;
      const dy = center.y - py;
      let rad = Math.atan2(dy, dx);
      let deg = (rad * 180) / Math.PI;
      return normalizeAngle(deg);
    }

    function getLunarDay(deg) {
      let dayIdx = Math.floor((deg / 360) * 30) + 1;
      if (dayIdx > 30) dayIdx = 30;
      return {
        index: dayIdx,
        name: LUNAR_DAY_NAMES[dayIdx - 1]
      };
    }

    function getPhaseInfo(deg) {
      const dayData = getLunarDay(deg);
      const day = dayData.index;
      for (let p of EIGHT_PHASES) {
        if (day >= p.minDay && day <= p.maxDay) {
          return p;
        }
      }
      return EIGHT_PHASES[0];
    }

    function getIlluminationPercent(deg) {
      const rad = (deg * Math.PI) / 180;
      const percent = ((1 - Math.cos(rad)) / 2) * 100;
      return percent.toFixed(1);
    }

    function drawEarthViewMoon(c, x, y, r, deg, highlightGlow = false) {
      c.save();
      c.translate(x, y);

      deg = normalizeAngle(deg);

      c.beginPath();
      c.arc(0, 0, r, 0, Math.PI * 2);
      c.fillStyle = '#1e293b';
      c.fill();
      c.lineWidth = 1;
      c.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      c.stroke();

      c.save();
      c.beginPath();
      c.arc(0, 0, r, 0, Math.PI * 2);
      c.clip();
      c.fillStyle = 'rgba(0, 0, 0, 0.3)';
      c.beginPath();
      c.arc(-r * 0.3, -r * 0.2, r * 0.25, 0, Math.PI * 2);
      c.arc(r * 0.2, r * 0.35, r * 0.3, 0, Math.PI * 2);
      c.arc(r * 0.35, -r * 0.3, r * 0.18, 0, Math.PI * 2);
      c.fill();
      c.restore();

      const rad = (deg * Math.PI) / 180;
      const k = Math.cos(rad);

      c.fillStyle = '#fef08a';
      if (highlightGlow) {
        c.shadowColor = 'rgba(253, 224, 71, 0.8)';
        c.shadowBlur = r * 0.6;
      }

      c.beginPath();

      if (deg >= 0 && deg <= 180) {
        c.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, false);
        c.ellipse(0, 0, Math.abs(k) * r, r, 0, Math.PI / 2, -Math.PI / 2, k > 0);
      } else {
        c.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, true);
        c.ellipse(0, 0, Math.abs(k) * r, r, 0, Math.PI / 2, -Math.PI / 2, k < 0);
      }

      c.closePath();
      c.fill();

      c.save();
      c.clip();
      c.fillStyle = 'rgba(217, 119, 6, 0.18)';
      c.beginPath();
      c.arc(-r * 0.3, -r * 0.2, r * 0.22, 0, Math.PI * 2);
      c.arc(r * 0.2, r * 0.35, r * 0.28, 0, Math.PI * 2);
      c.arc(r * 0.35, -r * 0.3, r * 0.16, 0, Math.PI * 2);
      c.fill();
      c.restore();

      c.restore();
    }

    function drawSpaceViewMoon(c, x, y, r) {
      c.save();
      c.translate(x, y);

      c.beginPath();
      c.arc(0, 0, r, Math.PI / 2, (Math.PI * 3) / 2, false);
      c.fillStyle = '#1e293b';
      c.fill();

      c.beginPath();
      c.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, false);
      c.fillStyle = '#fef08a';
      c.fill();

      c.lineWidth = 1;
      c.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      c.beginPath();
      c.arc(0, 0, r, 0, Math.PI * 2);
      c.stroke();

      c.restore();
    }

    const stars = Array.from({ length: 80 }, () => ({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.5 + 0.5,
      alpha: Math.random() * 0.7 + 0.3
    }));

    function drawStarfield(c) {
      for (let s of stars) {
        c.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        c.beginPath();
        c.arc(s.x * viewWidth, s.y * viewHeight, s.r, 0, Math.PI * 2);
        c.fill();
      }
    }

    function drawEarth(c) {
      const rEarth = orbitRadius * 0.24;

      c.save();
      c.translate(center.x, center.y);

      const glowGrad = c.createRadialGradient(0, 0, rEarth * 0.9, 0, 0, rEarth * 1.4);
      glowGrad.addColorStop(0, 'rgba(56, 189, 248, 0.4)');
      glowGrad.addColorStop(1, 'rgba(56, 189, 248, 0)');
      c.fillStyle = glowGrad;
      c.beginPath();
      c.arc(0, 0, rEarth * 1.4, 0, Math.PI * 2);
      c.fill();

      c.beginPath();
      c.arc(0, 0, rEarth, Math.PI / 2, (Math.PI * 3) / 2, false);
      c.fillStyle = '#0b1329';
      c.fill();

      c.beginPath();
      c.arc(0, 0, rEarth, -Math.PI / 2, Math.PI / 2, false);
      c.fillStyle = '#1d4ed8';
      c.fill();

      c.save();
      c.beginPath();
      c.arc(0, 0, rEarth, 0, Math.PI * 2);
      c.clip();

      c.fillStyle = '#15803d';
      c.beginPath();
      c.arc(rEarth * 0.3, -rEarth * 0.2, rEarth * 0.4, 0, Math.PI * 2);
      c.arc(rEarth * 0.5, rEarth * 0.3, rEarth * 0.35, 0, Math.PI * 2);
      c.fill();

      c.fillStyle = 'rgba(255, 255, 255, 0.4)';
      c.beginPath();
      c.arc(rEarth * 0.2, -rEarth * 0.4, rEarth * 0.3, 0, Math.PI * 2);
      c.arc(-rEarth * 0.3, rEarth * 0.2, rEarth * 0.25, 0, Math.PI * 2);
      c.fill();

      c.restore();

      c.lineWidth = 1.5;
      c.strokeStyle = '#38bdf8';
      c.beginPath();
      c.arc(0, 0, rEarth, 0, Math.PI * 2);
      c.stroke();

      c.font = 'bold 12px sans-serif';
      c.fillStyle = '#ffffff';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.shadowColor = 'rgba(0,0,0,0.8)';
      c.shadowBlur = 4;
      c.fillText('地 球', 0, 0);

      c.restore();
    }

    function drawSunlight(c) {
      const startX = viewWidth - 15;
      const endX = viewWidth - 80;
      const rayYPositions = [-0.35, -0.2, -0.05, 0.1, 0.25, 0.4];

      c.save();

      c.strokeStyle = 'rgba(250, 204, 21, 0.6)';
      c.lineWidth = 2;
      c.setLineDash([6, 4]);

      for (let relY of rayYPositions) {
        const y = center.y + relY * orbitRadius * 2;
        c.beginPath();
        c.moveTo(startX, y);
        c.lineTo(endX, y);
        c.stroke();

        c.setLineDash([]);
        c.fillStyle = 'rgba(250, 204, 21, 0.9)';
        c.beginPath();
        c.moveTo(endX, y);
        c.lineTo(endX + 8, y - 4);
        c.lineTo(endX + 8, y + 4);
        c.closePath();
        c.fill();
        c.setLineDash([6, 4]);
      }

      c.setLineDash([]);

      const textX = viewWidth - 30;
      c.font = 'bold 15px sans-serif';
      c.fillStyle = '#fef08a';
      c.textAlign = 'center';
      c.shadowColor = 'rgba(250, 204, 21, 0.8)';
      c.shadowBlur = 8;

      const letters = ['太', '陽', '光'];
      letters.forEach((char, idx) => {
        c.fillText(char, textX, center.y - 25 + idx * 24);
      });

      c.restore();
    }

    function drawOrbit(c) {
      c.save();

      c.beginPath();
      c.arc(center.x, center.y, orbitRadius, 0, Math.PI * 2);
      c.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      c.lineWidth = 1.5;
      c.setLineDash([4, 4]);
      c.stroke();
      c.setLineDash([]);

      for (let i = 0; i < 30; i++) {
        const deg = (i * 360) / 30;
        const isMajor = (i % 5 === 0);
        const tickInner = orbitRadius - (isMajor ? 7 : 4);
        const tickOuter = orbitRadius + (isMajor ? 7 : 4);

        const posIn = angleToPosition(deg, tickInner);
        const posOut = angleToPosition(deg, tickOuter);

        c.beginPath();
        c.moveTo(posIn.x, posIn.y);
        c.lineTo(posOut.x, posOut.y);
        c.strokeStyle = isMajor ? 'rgba(250, 204, 21, 0.9)' : 'rgba(255, 255, 255, 0.4)';
        c.lineWidth = isMajor ? 2 : 1;
        c.stroke();

        const textPos = angleToPosition(deg, orbitRadius + 15);
        c.font = isMajor ? 'bold 10px sans-serif' : '9px sans-serif';
        c.fillStyle = isMajor ? 'rgba(250, 204, 21, 0.95)' : 'rgba(226, 232, 240, 0.8)';
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        c.shadowColor = 'rgba(0, 0, 0, 0.9)';
        c.shadowBlur = 3;
        c.fillText(LUNAR_DAY_NAMES[i], textPos.x, textPos.y);
      }

      const arrowAngles = [45, 135, 225, 315];
      c.strokeStyle = '#ef4444';
      c.fillStyle = '#ef4444';
      c.lineWidth = 2.5;

      for (let aDeg of arrowAngles) {
        const startR = aDeg - 12;
        const endR = aDeg + 12;

        c.beginPath();
        c.arc(center.x, center.y, orbitRadius, -((endR * Math.PI) / 180), -((startR * Math.PI) / 180), false);
        c.stroke();

        const tipPos = angleToPosition(endR, orbitRadius);
        const tangentAngle = ((endR + 90) * Math.PI) / 180;

        c.save();
        c.translate(tipPos.x, tipPos.y);
        c.rotate(-tangentAngle);
        c.beginPath();
        c.moveTo(0, 0);
        c.lineTo(-7, -4);
        c.lineTo(-7, 4);
        c.closePath();
        c.fill();
        c.restore();
      }

      c.restore();
    }

    function drawEightPhaseMarkers(c) {
      const outerR = orbitRadius * 1.30;
      const innerR = orbitRadius * 0.62;
      const markerMoonRadius = Math.max(11, orbitRadius * 0.08);

      EIGHT_PHASES.forEach((phase) => {
        let midAngle = phase.markerAngle;

        if (chkSpaceMoons.checked) {
          const innerPos = angleToPosition(midAngle, innerR);
          drawSpaceViewMoon(c, innerPos.x, innerPos.y, markerMoonRadius * 0.65);
        }

        const outerPos = angleToPosition(midAngle, outerR);
        drawEarthViewMoon(c, outerPos.x, outerPos.y, markerMoonRadius, midAngle);

        const labelPos = angleToPosition(midAngle, outerR + markerMoonRadius + 12);
        c.font = 'bold 12px sans-serif';
        c.fillStyle = '#f3f4f6';
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        c.shadowColor = 'rgba(0,0,0,0.8)';
        c.shadowBlur = 4;
        c.fillText(phase.name, labelPos.x, labelPos.y);
      });
    }

    function drawActiveMoon(c) {
      const activeMoonRadius = Math.max(15, orbitRadius * 0.11);
      const pos = angleToPosition(currentAngle, orbitRadius);

      if (chkSightLine.checked) {
        c.save();
        c.beginPath();
        c.moveTo(center.x, center.y);
        c.lineTo(pos.x, pos.y);
        c.strokeStyle = 'rgba(56, 189, 248, 0.4)';
        c.lineWidth = 1.5;
        c.setLineDash([3, 3]);
        c.stroke();
        c.restore();
      }

      c.save();
      c.beginPath();
      c.arc(pos.x, pos.y, activeMoonRadius + 5, 0, Math.PI * 2);
      c.strokeStyle = 'rgba(250, 204, 21, 0.8)';
      c.lineWidth = 2;
      c.shadowColor = 'rgba(250, 204, 21, 0.9)';
      c.shadowBlur = 10;
      c.stroke();
      c.restore();

      drawEarthViewMoon(c, pos.x, pos.y, activeMoonRadius, currentAngle, true);

      const dayData = getLunarDay(currentAngle);
      const phaseInfo = getPhaseInfo(currentAngle);
      const tagText = `${dayData.name} · ${phaseInfo.name}`;

      const tagY = pos.y - activeMoonRadius - 24;
      const tagX = pos.x;

      c.save();
      c.font = 'bold 12px sans-serif';
      const textWidth = c.measureText(tagText).width;
      const padX = 10;

      c.fillStyle = 'rgba(15, 23, 42, 0.9)';
      c.strokeStyle = '#38bdf8';
      c.lineWidth = 1.5;
      c.shadowColor = 'rgba(56, 189, 248, 0.5)';
      c.shadowBlur = 8;

      const rectW = textWidth + padX * 2;
      const rectH = 22;
      const rectX = tagX - rectW / 2;
      const rectY = tagY - rectH / 2;

      c.beginPath();
      c.roundRect(rectX, rectY, rectW, rectH, 11);
      c.fill();
      c.stroke();

      c.beginPath();
      c.moveTo(tagX - 5, rectY + rectH);
      c.lineTo(tagX + 5, rectY + rectH);
      c.lineTo(tagX, rectY + rectH + 5);
      c.closePath();
      c.fillStyle = '#38bdf8';
      c.fill();

      c.fillStyle = '#fef08a';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.shadowBlur = 0;
      c.fillText(tagText, tagX, tagY);

      c.restore();
    }

    function updateTelescopeAndInfo() {
      const deg = normalizeAngle(currentAngle);
      const dayData = getLunarDay(deg);
      const phaseInfo = getPhaseInfo(deg);
      const illum = getIlluminationPercent(deg);

      teleCtx.clearRect(0, 0, 160, 160);
      
      teleCtx.fillStyle = '#020617';
      teleCtx.fillRect(0, 0, 160, 160);

      teleCtx.strokeStyle = 'rgba(56, 189, 248, 0.15)';
      teleCtx.lineWidth = 1;
      teleCtx.beginPath();
      teleCtx.moveTo(80, 0); teleCtx.lineTo(80, 160);
      teleCtx.moveTo(0, 80); teleCtx.lineTo(160, 80);
      teleCtx.stroke();

      drawEarthViewMoon(teleCtx, 80, 80, 58, deg, true);

      infoLunarDay.textContent = `${dayData.name} (第 ${dayData.index} 天)`;
      infoPhaseName.textContent = `${phaseInfo.name} (${phaseInfo.altName})`;
      infoAngle.textContent = `${deg.toFixed(1)}°`;
      infoIllumination.textContent = `${illum}%`;

      badgePhaseType.textContent = `${dayData.name} · ${phaseInfo.name}`;
      telescopePhaseTitle.textContent = `農曆${dayData.name} · ${phaseInfo.name}`;
      telescopeDesc.textContent = phaseInfo.desc;
    }

    function renderFrame() {
      ctx.save();
      // High-DPI Scaling Transform
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, viewWidth, viewHeight);

      drawStarfield(ctx);
      drawSunlight(ctx);
      drawOrbit(ctx);
      drawEarth(ctx);
      drawEightPhaseMarkers(ctx);
      drawActiveMoon(ctx);

      ctx.restore();

      updateTelescopeAndInfo();
    }

    function animate() {
      if (isPlaying) {
        currentAngle = normalizeAngle(currentAngle + 0.3 * playSpeed);
      }
      renderFrame();
      requestAnimationFrame(animate);
    }

    function getEventCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      let clientX = e.clientX;
      let clientY = e.clientY;

      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      }

      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    // Check hit on current active moon
    function checkHitMoon(pos) {
      const moonPos = angleToPosition(currentAngle, orbitRadius);
      const dx = pos.x - moonPos.x;
      const dy = pos.y - moonPos.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      return dist <= 45;
    }

    // Check hit near orbit ring
    function checkHitOrbit(pos) {
      const dx = pos.x - center.x;
      const dy = pos.y - center.y;
      const distFromCenter = Math.sqrt(dx * dx + dy * dy);
      return Math.abs(distFromCenter - orbitRadius) <= 35;
    }

    function handleDragStart(e) {
      const pos = getEventCanvasPos(e);
      if (checkHitMoon(pos) || checkHitOrbit(pos)) {
        isDragging = true;
        isPlaying = false;
        updatePlayButtonUI();
        currentAngle = positionToAngle(pos.x, pos.y);
        renderFrame();
        canvas.style.cursor = 'grabbing';
        e.preventDefault();
      }
    }

    function handleDragMove(e) {
      const pos = getEventCanvasPos(e);
      
      // Update cursor icon when hovering over moon or orbit
      if (!isDragging) {
        if (checkHitMoon(pos) || checkHitOrbit(pos)) {
          canvas.style.cursor = 'grab';
        } else {
          canvas.style.cursor = 'default';
        }
        return;
      }

      currentAngle = positionToAngle(pos.x, pos.y);
      e.preventDefault();
    }

    function handleDragEnd(e) {
      isDragging = false;
      canvas.style.cursor = 'default';
    }

    canvas.addEventListener('mousedown', handleDragStart);
    window.addEventListener('mousemove', handleDragMove);
    window.addEventListener('mouseup', handleDragEnd);

    canvas.addEventListener('touchstart', handleDragStart, { passive: false });
    window.addEventListener('touchmove', handleDragMove, { passive: false });
    window.addEventListener('touchend', handleDragEnd);
    window.addEventListener('touchcancel', handleDragEnd);

    function updatePlayButtonUI() {
      if (isPlaying) {
        playIcon.textContent = '⏸';
        playText.textContent = '暫停';
        btnPlayPause.classList.remove('bg-amber-500', 'hover:bg-amber-400');
        btnPlayPause.classList.add('bg-sky-500', 'hover:bg-sky-400');
      } else {
        playIcon.textContent = '▶';
        playText.textContent = '自動播放';
        btnPlayPause.classList.remove('bg-sky-500', 'hover:bg-sky-400');
        btnPlayPause.classList.add('bg-amber-500', 'hover:bg-amber-400');
      }
    }

    btnPlayPause.addEventListener('click', () => {
      isPlaying = !isPlaying;
      updatePlayButtonUI();
    });

    speedSlider.addEventListener('input', (e) => {
      playSpeed = parseFloat(e.target.value);
      speedVal.textContent = playSpeed.toFixed(1) + 'x';
    });

    btnReset.addEventListener('click', () => {
      currentAngle = 0;
      isPlaying = false;
      updatePlayButtonUI();
      renderFrame();
    });

    chkSpaceMoons.addEventListener('change', renderFrame);
    chkSightLine.addEventListener('change', renderFrame);

    window.addEventListener('resize', () => {
      updateCanvasSize();
      renderFrame();
    });

    window.onload = function() {
      updateCanvasSize();
      animate();
    };
  </script>
</body>
</html>
