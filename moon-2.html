<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月亮觀測與月相變化互動學習網</title>
    <!-- 引入 Tailwind CSS 美化介面 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Twinkle background stars effect */
        .star {
            animation: twinkle 3s infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col relative overflow-x-hidden select-none">

    <!-- 全螢幕手繪註記畫布 (z-40，預設 pointer-events-none 不擋住底下點擊) -->
    <canvas id="drawing-canvas" class="fixed inset-0 z-40 pointer-events-none w-full h-full"></canvas>

    <!-- 頂部導航欄 (單一行化設計) -->
    <header class="bg-slate-900 border-b border-slate-800 py-2.5 px-4 shadow-md relative z-50">
        <div class="w-[80%] max-w-7xl mx-auto flex flex-row items-center justify-between gap-3 flex-wrap lg:flex-nowrap">
            
            <!-- 1. 標題區 (精簡單列) -->
            <div class="flex items-center gap-2 shrink-0">
                <span class="text-xl">🌙</span>
                <h1 class="text-base sm:text-lg font-bold bg-gradient-to-r from-amber-200 to-indigo-400 bg-clip-text text-transparent whitespace-nowrap">
                    月亮觀測與月相變化互動學習網
                </h1>
            </div>

            <!-- 2. 螢幕手繪註記工具列 (移動至中間並排) -->
            <div class="flex items-center gap-1.5 bg-slate-950/80 p-1 rounded-lg border border-slate-800 shadow-inner shrink-0">
                <button id="draw-toggle-btn" onclick="toggleDrawingMode()" class="px-2 py-1 rounded text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 transition-all flex items-center gap-1 border border-slate-700 cursor-pointer">
                    <span>✏️ 螢幕畫筆</span>
                    <span id="draw-status-tag" class="text-[9px] bg-slate-900 text-slate-400 px-1 py-0.5 rounded">關閉</span>
                </button>
                
                <!-- 多色選擇 -->
                <div class="flex items-center gap-1 px-1 border-l border-slate-800">
                    <button onclick="setDrawColor('#f87171')" class="color-btn w-3.5 h-3.5 rounded-full bg-red-400 border-2 border-white transition-all transform hover:scale-110 cursor-pointer" data-color="#f87171" title="紅色"></button>
                    <button onclick="setDrawColor('#facc15')" class="color-btn w-3.5 h-3.5 rounded-full bg-yellow-400 border-2 border-transparent transition-all transform hover:scale-110 cursor-pointer" data-color="#facc15" title="黃色"></button>
                    <button onclick="setDrawColor('#4ade80')" class="color-btn w-3.5 h-3.5 rounded-full bg-green-400 border-2 border-transparent transition-all transform hover:scale-110 cursor-pointer" data-color="#4ade80" title="綠色"></button>
                    <button onclick="setDrawColor('#38bdf8')" class="color-btn w-3.5 h-3.5 rounded-full bg-sky-400 border-2 border-transparent transition-all transform hover:scale-110 cursor-pointer" data-color="#38bdf8" title="藍色"></button>
                    <button onclick="setDrawColor('#ffffff')" class="color-btn w-3.5 h-3.5 rounded-full bg-white border-2 border-transparent transition-all transform hover:scale-110 cursor-pointer" data-color="#ffffff" title="白色"></button>
                </div>
                
                <!-- 清除畫布 -->
                <button onclick="clearCanvas()" class="px-2 py-1 rounded text-xs bg-red-950/40 hover:bg-red-900/60 text-red-300 border border-red-900/50 transition-all cursor-pointer" title="清除所有註記">
                    🗑️ 清除
                </button>
            </div>

            <!-- 3. 動態播放控制鈕 (右側單行) -->
            <div class="flex items-center gap-2 shrink-0">
                <button onclick="simulateDayMovement()" id="play-day-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium px-3 py-1.5 rounded-md transition-all flex items-center gap-1 shadow shadow-indigo-900/30 cursor-pointer whitespace-nowrap">
                    <span>🎬 模擬一天移動</span>
                </button>
                <button onclick="togglePhaseAnimation()" id="play-phase-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-3 py-1.5 rounded-md transition-all flex items-center gap-1 shadow shadow-emerald-900/30 cursor-pointer whitespace-nowrap">
                    <span id="play-phase-text">🔄 播放月相盈虧</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 (80% 寬度置中，上下垂直排列) -->
    <main class="w-[80%] max-w-7xl mx-auto py-6 flex flex-col gap-6 flex-grow relative z-10">
        
        <!-- 上方：天文觀測模擬星空 (容器高度 480px，縱軸加寬) -->
        <div class="w-full flex flex-col gap-4">
            <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl flex flex-col">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-base sm:text-lg font-bold text-slate-200 flex items-center gap-2">
                        <span>🌌</span> 模擬觀測夜空 (拖曳或點擊可移動月亮)
                    </h2>
                    <span class="text-xs bg-slate-800 text-slate-300 px-3 py-1 rounded-full border border-slate-700 font-medium">面朝正南方觀察</span>
                </div>

                <!-- 星空畫布容器 -->
                <div id="grid-container" class="relative w-full h-[480px] bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 border border-slate-700/80 rounded-xl overflow-hidden cursor-crosshair select-none">
                    
                    <!-- 隨機背景星星 -->
                    <svg class="absolute inset-0 w-full h-full opacity-60 pointer-events-none">
                        <circle cx="50" cy="50" r="1.2" fill="#fff" class="star" style="animation-delay: 0.2s" />
                        <circle cx="120" cy="120" r="1.8" fill="#fff" class="star" style="animation-delay: 1.5s" />
                        <circle cx="180" cy="40" r="1.2" fill="#fff" class="star" style="animation-delay: 0.8s" />
                        <circle cx="280" cy="100" r="1.5" fill="#fff" class="star" style="animation-delay: 2.1s" />
                        <circle cx="340" cy="60" r="1.2" fill="#fff" class="star" style="animation-delay: 1.1s" />
                        <circle cx="420" cy="140" r="1.8" fill="#fff" class="star" style="animation-delay: 0.5s" />
                        <circle cx="460" cy="50" r="1.2" fill="#fff" class="star" style="animation-delay: 2.7s" />
                        <circle cx="220" cy="180" r="1.5" fill="#fff" class="star" style="animation-delay: 1.8s" />
                        <circle cx="380" cy="220" r="1.2" fill="#fff" class="star" style="animation-delay: 0.4s" />
                    </svg>

                    <!-- 高度角與方位角 坐標軸線 -->
                    <svg id="sky-grid" class="absolute inset-0 w-full h-full pointer-events-none select-none" viewBox="0 0 500 450" preserveAspectRatio="none">
                        <defs>
                            <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                                <feGaussianBlur stdDeviation="8" result="blur" />
                                <feComposite in="SourceGraphic" in2="blur" operator="over" />
                            </filter>
                        </defs>

                        <!-- 高度角橫線 (10° ~ 90°，每 10° 為 40 單位距離) -->
                        <line x1="40" y1="360" x2="460" y2="360" stroke="#334155" stroke-dasharray="3 3" stroke-width="1" />
                        <text x="16" y="364" fill="#64748b" font-size="10" font-weight="bold">10°</text>

                        <line x1="40" y1="320" x2="460" y2="320" stroke="#334155" stroke-dasharray="3 3" stroke-width="1" />
                        <text x="16" y="324" fill="#64748b" font-size="10" font-weight="bold">20°</text>

                        <line x1="40" y1="280" x2="460" y2="280" stroke="#334155" stroke-dasharray="3 3" stroke-width="1" />
                        <text x="16" y="284" fill="#64748b" font-size="10" font-weight="bold">30°</text>

                        <line x1="40" y1="240" x2="460" y2="240" stroke="#334155" stroke-dasharray="3 3" stroke-width="1" />
                        <text x="16" y="244" fill="#64748b" font-size="10" font-weight="bold">40°</text>

                        <line x1="40" y1="200" x2="460" y2="200" stroke="#475569" stroke-dasharray="3 3" stroke-width="1" />
                        <text x="16" y="204" fill="#94a3b8" font-size="10" font-weight="bold">50°</text>

                        <line x1="40" y1="160" x2="460" y2="160" stroke="#334155" stroke-dasharray="3 3" stroke-width="1" />
                        <text x="16" y="164" fill="#64748b" font-size="10" font-weight="bold">60°</text>

                        <line x1="40" y1="120" x2="460" y2="120" stroke="#334155" stroke-dasharray="3 3" stroke-width="1" />
                        <text x="16" y="124" fill="#64748b" font-size="10" font-weight="bold">70°</text>

                        <line x1="40" y1="80" x2="460" y2="80" stroke="#334155" stroke-dasharray="3 3" stroke-width="1" />
                        <text x="16" y="84" fill="#64748b" font-size="10" font-weight="bold">80°</text>

                        <line x1="40" y1="40" x2="460" y2="40" stroke="#475569" stroke-dasharray="4 4" stroke-width="1" />
                        <text x="16" y="44" fill="#94a3b8" font-size="10" font-weight="bold">90°</text>

                        <!-- 方位角直線 -->
                        <line x1="145" y1="40" x2="145" y2="400" stroke="#334155" stroke-dasharray="4 4" />
                        <line x1="250" y1="40" x2="250" y2="400" stroke="#475569" stroke-dasharray="4 4" stroke-width="1.2" />
                        <line x1="355" y1="40" x2="355" y2="400" stroke="#334155" stroke-dasharray="4 4" />

                        <!-- 方位地平線 -->
                        <line x1="40" y1="400" x2="460" y2="400" stroke="#64748b" stroke-width="2" />
                        
                        <!-- 方位地平標籤 -->
                        <text x="40" y="424" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">東 (90°)</text>
                        <text x="145" y="424" fill="#94a3b8" font-size="11" text-anchor="middle">東南</text>
                        <text x="250" y="424" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">正南 (180°)</text>
                        <text x="355" y="424" fill="#94a3b8" font-size="11" text-anchor="middle">西南</text>
                        <text x="460" y="424" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">西 (270°)</text>

                        <!-- 動態月亮組 -->
                        <g id="moon-group" class="cursor-pointer" filter="url(#glow)">
                            <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
                            <path id="moon-lit-path" fill="#fef08a" />
                            <circle id="moon-full-circle" cx="0" cy="0" r="16" fill="#fef08a" style="display: none;" />
                        </g>
                    </svg>
                </div>
                
                <!-- 快捷操作說明 -->
                <p class="text-xs sm:text-sm text-slate-400 mt-2.5 text-center">
                    💡 使用滑鼠或手機觸控「拖曳月亮」，即可即時調整高度角（縱軸）與方位角（橫軸）。
                </p>
            </div>
        </div>

        <!-- 下方：月相變化控制台 -->
        <div class="w-full flex flex-col gap-4">
            <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl flex flex-col justify-between">
                
                <div>
                    <!-- 控制台標題與指示 -->
                    <div class="flex justify-between items-center mb-5">
                        <h2 class="text-lg sm:text-xl font-bold text-slate-100 flex items-center gap-2">
                            <span>⚙️</span> 月相變化控制台
                        </h2>
                        <span class="text-base sm:text-xl font-bold text-amber-300 flex items-center gap-1" id="phase-name">
                            🌕 虧凸月
                        </span>
                    </div>

                    <!-- 月相控制器 -->
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-base text-slate-200 font-semibold">🌑 月相選擇與控制：</span>
                        </div>
                        
                        <!-- 8個經典月相快捷鈕 -->
                        <div class="grid grid-cols-4 sm:grid-cols-8 gap-2 mb-4">
                            <button onclick="setMoonPhase(0)" class="phase-btn py-2 text-xs sm:text-sm rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 cursor-pointer font-medium">新月</button>
                            <button onclick="setMoonPhase(1)" class="phase-btn py-2 text-xs sm:text-sm rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 cursor-pointer font-medium">眉月</button>
                            <button onclick="setMoonPhase(2)" class="phase-btn py-2 text-xs sm:text-sm rounded-lg bg-indigo-900 border border-indigo-500 font-bold text-white cursor-pointer">上弦</button>
                            <button onclick="setMoonPhase(3)" class="phase-btn py-2 text-xs sm:text-sm rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 cursor-pointer font-medium">盈凸</button>
                            <button onclick="setMoonPhase(4)" class="phase-btn py-2 text-xs sm:text-sm rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 cursor-pointer font-medium">滿月</button>
                            <button onclick="setMoonPhase(5)" class="phase-btn py-2 text-xs sm:text-sm rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 cursor-pointer font-medium">虧凸</button>
                            <button onclick="setMoonPhase(6)" class="phase-btn py-2 text-xs sm:text-sm rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 cursor-pointer font-medium">下弦</button>
                            <button onclick="setMoonPhase(7)" class="phase-btn py-2 text-xs sm:text-sm rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 cursor-pointer font-medium">殘月</button>
                        </div>

                        <!-- 月相滑桿 -->
                        <input type="range" id="phase-slider" min="0" max="7" value="2" step="1"
                               class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-amber-300 my-2">
                        
                        <!-- 月相科普說明 -->
                        <div class="mt-4 bg-slate-950/80 p-4 sm:p-5 rounded-xl border border-slate-700/80 min-h-[75px] flex items-center shadow-inner">
                            <p class="text-base sm:text-lg text-amber-100/90 leading-relaxed font-medium" id="phase-desc">
                                農曆十八至十九。亮面開始缺角，亮面在左半邊居多，入夜後從東方升起。
                            </p>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </main>

    <!-- 底部版權宣告 -->
    <footer class="bg-slate-950 border-t border-slate-900 py-4 text-center text-xs sm:text-sm text-slate-500 mt-auto relative z-10">
        <p>© 2026 互動式天文觀測學習教具 · 面向正南方觀測設計</p>
    </footer>

    <!-- JavaScript 業務邏輯 -->
    <script>
        // 狀態變數
        let currentAlt = 45;
        let currentAz = 180;
        let currentPhaseIndex = 2;
        let isPhaseAnimating = false;
        let phaseAnimInterval = null;
        let isDaySimulating = false;

        // 螢幕手繪註記狀態
        let isDrawingMode = false;
        let drawColor = '#f87171';
        let drawLineWidth = 3;

        // 月相詳細資料
        const MOON_PHASES = [
            { name: '🌑 新月 (朔)', desc: '農曆初一。月亮亮面背對地球，與太陽同升同落，夜空看不見月亮。' },
            { name: '🌒 眉月', desc: '農曆初三至初四。夕陽西下後可在西方低空看到彎彎如眉毛的亮面（亮右邊）。' },
            { name: '🌓 上弦月', desc: '農曆初七至初八。亮面在右半邊，黃昏時在中天（正南方）最高，半夜在西方落下。' },
            { name: '🌔 盈凸月', desc: '農曆初十至十一。亮面大於半圓，大部分亮面在右邊，傍晚從東南方升起。' },
            { name: '🌕 滿月 (望)', desc: '農曆十五至十六。整顆月亮通亮，太陽西落時月亮從東方升起，整夜可見。' },
            { name: '🌖 虧凸月', desc: '農曆十八至十九。亮面開始缺角，亮面在左半邊居多，入夜後從東方升起。' },
            { name: '🌗 下弦月', desc: '農曆二十二至二十三。亮面在左半邊，半夜才從東方升起，清晨在中天（正南方）。' },
            { name: '🌘 殘月', desc: '農曆二十五至二十六。彎彎亮面在左邊，黎明前出現在東方低空，隨太陽升起而隱沒。' }
        ];

        // DOM 引用宣告
        let phaseSlider, gridContainer;
        let moonGroup, moonLitPath, moonFullCircle;
        let phaseName, phaseDesc;

        // DOM 載入後初始化
        window.addEventListener('DOMContentLoaded', () => {
            phaseSlider = document.getElementById('phase-slider');
            gridContainer = document.getElementById('grid-container');

            moonGroup = document.getElementById('moon-group');
            moonLitPath = document.getElementById('moon-lit-path');
            moonFullCircle = document.getElementById('moon-full-circle');

            phaseName = document.getElementById('phase-name');
            phaseDesc = document.getElementById('phase-desc');

            // 綁定月相滑桿
            phaseSlider.addEventListener('input', (e) => {
                currentPhaseIndex = parseInt(e.target.value);
                updateMoonVisualization();
            });

            // 初始化星空拖曳與繪圖畫布
            setupSkyDragging();
            initDrawingCanvas();

            // 繪製初始狀態
            updateMoonVisualization();
        });

        // 畫面更新核心函式
        function updateMoonVisualization() {
            if (!phaseName || !phaseDesc) return;

            // 1. 更新月相文字與描述
            phaseName.textContent = MOON_PHASES[currentPhaseIndex].name;
            phaseDesc.textContent = MOON_PHASES[currentPhaseIndex].desc;

            // 同步月相滑桿
            phaseSlider.value = currentPhaseIndex;

            // 更新月相按鈕高亮
            document.querySelectorAll('.phase-btn').forEach((btn, idx) => {
                if (idx === currentPhaseIndex) {
                    btn.className = "phase-btn py-2 text-xs sm:text-sm rounded-lg bg-indigo-900 border border-indigo-500 font-bold text-white shadow cursor-pointer";
                } else {
                    btn.className = "phase-btn py-2 text-xs sm:text-sm rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 cursor-pointer font-medium";
                }
            });

            // 2. 計算月亮在 SVG 座標系中的位置 (viewBox Height = 450)
            const minX = 40, maxX = 460;
            const moonX = minX + ((currentAz - 90) / 180) * (maxX - minX);

            const minY = 400, maxY = 40;
            const moonY = minY - (currentAlt / 90) * (minY - maxY);

            moonGroup.setAttribute('transform', `translate(${moonX}, ${moonY})`);

            // 3. 繪製月相盈虧 SVG Path
            updateMoonPhaseShape(currentPhaseIndex);
        }

        // 根據月相 index 繪製月亮光亮部位
        function updateMoonPhaseShape(phaseIdx) {
            const r = 16;
            moonFullCircle.style.display = 'none';
            moonLitPath.style.display = 'block';

            let pathD = '';

            switch (phaseIdx) {
                case 0: // 新月
                    moonLitPath.style.display = 'none';
                    break;
                case 1: // 眉月
                    pathD = `M 0 -${r} A ${r} ${r} 0 0 1 0 ${r} A ${r*0.5} ${r} 0 0 0 0 -${r}`;
                    break;
                case 2: // 上弦月
                    pathD = `M 0 -${r} A ${r} ${r} 0 0 1 0 ${r} Z`;
                    break;
                case 3: // 盈凸月
                    pathD = `M 0 -${r} A ${r} ${r} 0 0 1 0 ${r} A ${r*0.5} ${r} 0 0 1 0 -${r}`;
                    break;
                case 4: // 滿月
                    moonLitPath.style.display = 'none';
                    moonFullCircle.style.display = 'block';
                    break;
                case 5: // 虧凸月
                    pathD = `M 0 -${r} A ${r} ${r} 0 0 0 0 ${r} A ${r*0.5} ${r} 0 0 0 0 -${r}`;
                    break;
                case 6: // 下弦月
                    pathD = `M 0 -${r} A ${r} ${r} 0 0 0 0 ${r} Z`;
                    break;
                case 7: // 殘月
                    pathD = `M 0 -${r} A ${r} ${r} 0 0 0 0 ${r} A ${r*0.5} ${r} 0 0 1 0 -${r}`;
                    break;
            }

            if (phaseIdx !== 0 && phaseIdx !== 4) {
                moonLitPath.setAttribute('d', pathD);
            }
        }

        // 快捷選擇月相
        function setMoonPhase(idx) {
            currentPhaseIndex = idx;
            updateMoonVisualization();
        }

        // 星空拖曳事件處理 (支援滑鼠與觸控)
        function setupSkyDragging() {
            let isDragging = false;

            function handleMove(clientX, clientY) {
                if (!gridContainer) return;
                const rect = gridContainer.getBoundingClientRect();
                let x = clientX - rect.left;
                let y = clientY - rect.top;

                x = Math.max(0, Math.min(rect.width, x));
                y = Math.max(0, Math.min(rect.height, y));

                let normX = x / rect.width;
                let normY = y / rect.height;

                let az = 90 + normX * 180;
                let alt = 90 - normY * 90;

                currentAlt = Math.round(alt);
                currentAz = Math.round(az);
                updateMoonVisualization();
            }

            gridContainer.addEventListener('mousedown', (e) => {
                if (isDrawingMode) return;
                isDragging = true;
                handleMove(e.clientX, e.clientY);
            });

            window.addEventListener('mousemove', (e) => {
                if (isDragging) handleMove(e.clientX, e.clientY);
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
            });

            gridContainer.addEventListener('touchstart', (e) => {
                if (isDrawingMode) return;
                if (e.touches.length > 0) {
                    isDragging = true;
                    handleMove(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (isDragging && e.touches.length > 0) {
                    handleMove(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            window.addEventListener('touchend', () => {
                isDragging = false;
            });
        }

        // 模擬一天東升西落移動
        function simulateDayMovement() {
            if (isDaySimulating) return;
            isDaySimulating = true;
            
            const playBtn = document.getElementById('play-day-btn');
            playBtn.disabled = true;
            playBtn.classList.add('opacity-50');

            let step = 0;
            const totalSteps = 40;
            const startAz = 90;
            const endAz = 270;

            const timer = setInterval(() => {
                step++;
                const progress = step / totalSteps;
                currentAz = Math.round(startAz + progress * (endAz - startAz));
                currentAlt = Math.round(Math.sin(progress * Math.PI) * 75);

                updateMoonVisualization();

                if (step >= totalSteps) {
                    clearInterval(timer);
                    isDaySimulating = false;
                    playBtn.disabled = false;
                    playBtn.classList.remove('opacity-50');
                }
            }, 50);
        }

        // 播放月相動畫
        function togglePhaseAnimation() {
            const btnText = document.getElementById('play-phase-text');
            if (isPhaseAnimating) {
                clearInterval(phaseAnimInterval);
                isPhaseAnimating = false;
                btnText.textContent = '🔄 播放月相盈虧';
            } else {
                isPhaseAnimating = true;
                btnText.textContent = '⏸️ 暫停月相動畫';
                phaseAnimInterval = setInterval(() => {
                    currentPhaseIndex = (currentPhaseIndex + 1) % 8;
                    updateMoonVisualization();
                }, 800);
            }
        }

        // ==========================================
        // 螢幕手繪註記 (Drawing Canvas Core)
        // ==========================================
        function initDrawingCanvas() {
            const canvas = document.getElementById('drawing-canvas');
            if (!canvas) return;

            function resizeCanvas() {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext('2d');
                if (canvas.width > 0 && canvas.height > 0) {
                    tempCtx.drawImage(canvas, 0, 0);
                }

                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                const ctx = canvas.getContext('2d');
                if (tempCanvas.width > 0 && tempCanvas.height > 0) {
                    ctx.drawImage(tempCanvas, 0, 0);
                }
            }

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            let drawing = false;
            let lastX = 0;
            let lastY = 0;

            function getPos(e) {
                if (e.touches && e.touches.length > 0) {
                    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
                return { x: e.clientX, y: e.clientY };
            }

            function startDraw(e) {
                if (!isDrawingMode) return;
                drawing = true;
                const pos = getPos(e);
                lastX = pos.x;
                lastY = pos.y;
            }

            function draw(e) {
                if (!drawing || !isDrawingMode) return;
                const ctx = canvas.getContext('2d');
                const pos = getPos(e);

                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.strokeStyle = drawColor;
                ctx.lineWidth = drawLineWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();

                lastX = pos.x;
                lastY = pos.y;
            }

            function stopDraw() {
                drawing = false;
            }

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDraw);
            canvas.addEventListener('mouseleave', stopDraw);

            canvas.addEventListener('touchstart', (e) => {
                if (isDrawingMode) {
                    startDraw(e);
                    if (e.cancelable) e.preventDefault();
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                if (isDrawingMode) {
                    draw(e);
                    if (e.cancelable) e.preventDefault();
                }
            }, { passive: false });

            canvas.addEventListener('touchend', stopDraw);
        }

        function toggleDrawingMode() {
            isDrawingMode = !isDrawingMode;
            const canvas = document.getElementById('drawing-canvas');
            const btn = document.getElementById('draw-toggle-btn');
            const statusTag = document.getElementById('draw-status-tag');

            if (isDrawingMode) {
                canvas.style.pointerEvents = 'auto';
                canvas.style.cursor = 'crosshair';
                btn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-400');
                btn.classList.remove('bg-slate-800', 'text-slate-200', 'border-slate-700');
                statusTag.textContent = '開啟中';
                statusTag.className = 'text-[9px] bg-red-500 text-white font-bold px-1 py-0.5 rounded animate-pulse';
            } else {
                canvas.style.pointerEvents = 'none';
                canvas.style.cursor = 'default';
                btn.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-400');
                btn.classList.add('bg-slate-800', 'text-slate-200', 'border-slate-700');
                statusTag.textContent = '關閉';
                statusTag.className = 'text-[9px] bg-slate-900 text-slate-400 px-1 py-0.5 rounded';
            }
        }

        function setDrawColor(color) {
            drawColor = color;
            document.querySelectorAll('.color-btn').forEach(btn => {
                if (btn.getAttribute('data-color') === color) {
                    btn.classList.add('border-white', 'scale-110');
                    btn.classList.remove('border-transparent');
                } else {
                    btn.classList.remove('border-white', 'scale-110');
                    btn.classList.add('border-transparent');
                }
            });

            if (!isDrawingMode) {
                toggleDrawingMode();
            }
        }

        function clearCanvas() {
            const canvas = document.getElementById('drawing-canvas');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }
    </script>
</body>
