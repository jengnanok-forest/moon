<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片範例</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 10px;
            width: 100%;
            font-family: sans-serif;
        }

        /* 第一、三、四張圖：100% 貼合右視窗，不產生捲軸 */
        .full-img {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 20px;
        }

        /* 第二張圖的獨立捲軸外框 */
        .scroll-box {
            width: 100%;
            height: 300px;          /* 給予固定高度，讓 height="250%" 能依此計算出 750px */
            overflow: auto;         /* 超出外框時自動出現獨立捲軸 */
            margin-bottom: 20px;
            border: 1px solid #ccc;
        }

        .scroll-box img {
            display: block;        /* 清除下方多餘空白，直接讀取 HTML 上的 250% 寬高 */
        }

        /* YouTube 影片適應右視窗寬度 */
        .video-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            margin-bottom: 20px;
        }

        .video-box iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <!-- 圖 1：100% 適應視窗 -->
    <img src="moonface01.png" class="full-img">

    <!-- 圖 2：保留 HTML 原有的 250% 屬性，在 scroll-box 內產生獨立雙向捲軸 -->
    <div class="scroll-box">
        <img src="moonface02.png" width="250%" height="60%">
    </div>

    <!-- 圖 3：100% 適應視窗 -->
    <img src="moonface03.jpg" class="full-img">

    <!-- 圖 4：100% 適應視窗 -->
    <img src="moonface04.jpg" class="full-img">

    <!-- YouTube 影片 -->
    <div class="video-box">
        <iframe 
          src="https://www.youtube.com/embed/gUsTvhMoTa4" 
          title="月相影片" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
    </div>

</body>
</html>
